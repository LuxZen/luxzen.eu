## luxzenburg.org — English-language essays
## Same Hugo source as luxzenburg.nl, different language root.
## Built files live at /var/www/luxzenburg-en on the host.

server {
    listen 80;
    server_name luxzenburg.org www.luxzenburg.org;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://luxzenburg.org$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name www.luxzenburg.org;

    ssl_certificate /etc/letsencrypt/live/luxzenburg.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/luxzenburg.org/privkey.pem;

    return 301 https://luxzenburg.org$request_uri;
}

server {
    listen 443 ssl http2;
    server_name luxzenburg.org;

    ssl_certificate /etc/letsencrypt/live/luxzenburg.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/luxzenburg.org/privkey.pem;

    root /var/www/luxzenburg-en;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'none'; base-uri 'self'; form-action 'self'" always;

    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    location ~* \.(css|woff2?|svg|png|jpg|jpeg|gif|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location = /essays/index.xml {
        default_type application/rss+xml;
    }

    location ~ /\. {
        deny all;
    }
}
