## luxzenburg.nl — Nederlandstalige essays
## Statische site, gebouwd door Hugo uit https://codeberg.org/eluxzen/luxzenburg
## De gebouwde bestanden worden door de deploy-hook naar
## /var/www/luxzenburg-nl op de host geschreven en hier door nginx geserveerd.
## Zie DEPLOY.md voor de volume-mount in docker-compose.yml.

server {
    listen 80;
    server_name luxzenburg.nl www.luxzenburg.nl;

    # Let's Encrypt http-01 challenge mag over plain http
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://luxzenburg.nl$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name www.luxzenburg.nl;

    ssl_certificate /etc/letsencrypt/live/luxzenburg.nl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/luxzenburg.nl/privkey.pem;

    return 301 https://luxzenburg.nl$request_uri;
}

server {
    listen 443 ssl http2;
    server_name luxzenburg.nl;

    ssl_certificate /etc/letsencrypt/live/luxzenburg.nl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/luxzenburg.nl/privkey.pem;

    root /var/www/luxzenburg-nl;
    index index.html;

    # Privacy-vriendelijke security headers; geen JS dus CSP mag streng
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'none'; base-uri 'self'; form-action 'self'" always;

    # Hugo genereert mappen met index.html
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    # Fingerprinted CSS — lange cache
    location ~* \.(css|woff2?|svg|png|jpg|jpeg|gif|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # RSS feed
    location = /essays/index.xml {
        default_type application/rss+xml;
    }

    # Geen toegang tot dotfiles
    location ~ /\. {
        deny all;
    }
}
